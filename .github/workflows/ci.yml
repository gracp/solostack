name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx next lint

      - run: npx tsc --noEmit

      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: next-build
          path: .next/
          retention-days: 7
